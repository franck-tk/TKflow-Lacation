<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign Up – TKflow Location</title>
  <link rel="stylesheet" href="./assets/css/styles.css">
</head>
<body>
  <header class="site-header">
    <a href="./index.html" class="brand">TKflow Location</a>
    <button class="hamburger" id="hamburgerBtn" aria-label="Menu">&#9776;</button>
    <div class="nav-wrapper" id="navWrapper">
      <nav class="main-nav">
        <a href="./index.html">Home</a>
        <a href="./about.html">About</a>
        <a href="./vehicules.html">Vehicles</a>
        <a href="./contact.html">Contact</a>
      </nav>
      <div class="header-actions">
        <div class="auth-actions"></div>
      </div>
    </div>
  </header>

  <main class="auth-page">
    <div class="auth-card">
      <h1>Create Account</h1>
      <p class="auth-subtitle">Join TKflow to start renting vehicles</p>
      <form id="signupForm" class="field-group">
        <label for="signupName">Username</label>
        <input type="text" id="signupName" required placeholder="Your username" autocomplete="username">
        <label for="signupEmail">Email address</label>
        <input type="email" id="signupEmail" required placeholder="you@example.com" autocomplete="email">
        <label for="signupPhone">Phone number</label>
        <input type="tel" id="signupPhone" required placeholder="+237 6XX XXX XXX" autocomplete="tel">
        <label for="signupPassword">Password</label>
        <input type="password" id="signupPassword" required placeholder="••••••••" autocomplete="new-password">
        <label for="signupConfirm">Confirm password</label>
        <input type="password" id="signupConfirm" required placeholder="••••••••" autocomplete="new-password">
        <label class="terms-label">
          <input type="checkbox" id="signupTerms" required>
          <span>I agree to the <a href="#" class="terms-link">Terms and Conditions</a></span>
        </label>
        <p id="authError" class="auth-error"></p>
        <button type="submit" class="btn primary auth-submit">Create Account</button>
      </form>
      <p class="auth-link">Already have an account? <a href="./login.html">Login</a></p>
    </div>
  </main>

  <script src="./assets/js/auth.js"></script>
</body>
</html>
