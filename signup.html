<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Inscription – TKflow</title>
  <link rel="stylesheet" href="./assets/css/styles.css">
</head>
<body>
  <header class="site-header">
    <div class="brand">TKflow Location</div>
    <button class="hamburger" id="hamburgerBtn" aria-label="Menu">&#9776;</button>
    <div class="nav-wrapper" id="navWrapper">
      <nav class="main-nav">
        <a href="./index.html">Accueil</a>
        <a href="./about.html">À propos</a>
        <a href="./vehicules.html">Véhicules</a>
        <a href="./reservations.html">Réservations</a>
        <a href="./dashboard.html">Dashboard</a>
        <a href="./contact.html">Contact</a>
      </nav>
      <div class="header-actions">
        <div class="auth-actions"></div>
      </div>
    </div>
  </header>

  <main class="auth-page">
    <div class="auth-card">
      <h1>Créer un compte</h1>
      <p class="auth-subtitle">Rejoignez TKflow pour réserver vos véhicules</p>
      <form id="signupForm" class="field-group">
        <label for="signupName">Nom complet</label>
        <input type="text" id="signupName" required placeholder="Votre nom complet" autocomplete="name">
        <label for="signupEmail">Adresse email</label>
        <input type="email" id="signupEmail" required placeholder="vous@exemple.com" autocomplete="email">
        <label for="signupPassword">Mot de passe</label>
        <input type="password" id="signupPassword" required placeholder="••••••••" autocomplete="new-password">
        <label for="signupConfirm">Confirmer le mot de passe</label>
        <input type="password" id="signupConfirm" required placeholder="••••••••" autocomplete="new-password">
        <p id="authError" class="auth-error"></p>
        <button type="submit" class="btn primary auth-submit">Créer mon compte</button>
      </form>
      <p class="auth-link">Déjà un compte ? <a href="./login.html">Se connecter</a></p>
    </div>
  </main>

  <script src="./assets/js/auth.js"></script>
</body>
</html>
